name: Deploy
on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

env:
    plugin_name: bill-vektor-salary

permissions:
    contents: read

jobs:
    php_unit:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: ['8.0', '8.2', '8.4']
                wp-versions: ['6.9']
        name: PHP Unit Test on PHP ${{ matrix.php-versions }} / WP ${{ matrix.wp-versions }} Test
        services:
            mysql:
                image: mysql:5.7
                ports:
                    - 3306
                env:
                    MYSQL_ROOT_PASSWORD: wordpress
                    MYSQL_DATABASE: wordpress
                    MYSQL_USER: wordpress
                    MYSQL_PASSWORD: wordpress
        steps:
            - uses: actions/checkout@v7
            - name: Read .node-version
              run: echo "NODEVERSION=$(cat .node-version)" >> "$GITHUB_OUTPUT"
              id: nodenv
            - name: Setup Node.js (.node-version)
              uses: actions/setup-node@v7
              with:
                  node-version: '${{ steps.nodenv.outputs.NODEVERSION }}'
            - name: Cache multiple paths
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
            - name: Setup PHP ${{ matrix.php-versions }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
            - name: install npm scripts
              run: npm install
            - name: Install Composer Packages
              run: composer install
            - name: Install WP-CLI
              run: |
                  curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                  chmod +x wp-cli.phar
                  mv wp-cli.phar /usr/local/bin/wp
            - name: Install several WordPress version by wp-env.override.json
              run: |
                  n=0
                  until [ $n -ge 5 ]
                  do
                      WP_ENV_CORE=WordPress/WordPress#${{ matrix.wp-versions }} WP_ENV_PHP_VERSION=${{ matrix.php-versions }} npm run wp-env start --update && break
                      n=$[$n+1]
                      echo "Retrying wp-env start --update ($n)..."
                      sleep 15
                  done
            - name: Check WordPress Version
              run: npm run wp-env run cli wp core version
            - name: Install Themes
              run: bash bin/install-theme.sh
            - name: Change Permittion
              run: sudo chmod -R 777 ~/wp-env
            - name: Run PHP Unit Test
              run: npm run phpunit
    release:
        runs-on: ubuntu-latest
        needs: [php_unit]
        permissions:
            contents: write
        concurrency:
            group: release-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
            - name: Read .node-version
              run: echo "NODEVERSION=$(cat .node-version)" >> "$GITHUB_OUTPUT"
              id: nodenv
            - name: Setup Node.js (.node-version)
              uses: actions/setup-node@v7
              with:
                  node-version: '${{ steps.nodenv.outputs.NODEVERSION }}'
            - name: Setup PHP 8.1
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.1
            - name: Install NPM Scripts
              run: npm install
            - name: Make Distribution
              # 本番依存のインストールから zip の検証まで同じ手順で実行する。
              run: npm run dist
            - name: Upload to draft release and publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.ref_name }}
              shell: bash
              run: |
                  set -euo pipefail
                  # 再実行では draft だけを再利用し、公開済みの配布物は変更しない。
                  if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
                      if [ "$is_draft" != true ]; then
                          echo "Release $RELEASE_TAG is already published; refusing to replace assets."
                          exit 1
                      fi
                  else
                      gh release create "$RELEASE_TAG" --draft --verify-tag --title "Release $RELEASE_TAG" --notes ""
                  fi
                  # 添付に失敗したら draft のまま停止し、成功した場合だけ公開する。
                  gh release upload "$RELEASE_TAG" "dist/${plugin_name}.zip" --clobber
                  gh release edit "$RELEASE_TAG" --draft=false
