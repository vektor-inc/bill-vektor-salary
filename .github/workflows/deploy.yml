name: Deploy
on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

env:
    plugin_name: bill-vektor-salary

jobs:
    php_unit:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: ['7.4', '8.2', '8.4']
                wp-versions: ['6.9']
        name: PHP Unit Test on PHP ${{ matrix.php-versions }} / WP ${{ matrix.wp-versions }} Test
        services:
            mysql:
                image: mysql:5.7
                ports:
                    - 3306
                env:
                    MYSQL_ROOT_PASSWORD: wordpress
                    MYSQL_DATABASE: wordpress
                    MYSQL_USER: wordpress
                    MYSQL_PASSWORD: wordpress
        steps:
            - uses: actions/checkout@v7
            - name: Read .node-version
              run: echo "NODEVERSION=$(cat .node-version)" >> "$GITHUB_OUTPUT"
              id: nodenv
            - name: Setup Node.js (.node-version)
              uses: actions/setup-node@v7
              with:
                  node-version: '${{ steps.nodenv.outputs.NODEVERSION }}'
            - name: Cache multiple paths
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
            - name: Setup PHP ${{ matrix.php-versions }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
            - name: install npm scripts
              run: npm install
            - name: Install Composer Packages
              run: composer install
            - name: Install WP-CLI
              run: |
                  curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                  chmod +x wp-cli.phar
                  mv wp-cli.phar /usr/local/bin/wp
            - name: Install several WordPress version by wp-env.override.json
              run: |
                  n=0
                  until [ $n -ge 5 ]
                  do
                      WP_ENV_CORE=WordPress/WordPress#${{ matrix.wp-versions }} WP_ENV_PHP_VERSION=${{ matrix.php-versions }} npm run wp-env start --update && break
                      n=$[$n+1]
                      echo "Retrying wp-env start --update ($n)..."
                      sleep 15
                  done
            - name: Check WordPress Version
              run: npm run wp-env run cli wp core version
            - name: Install Themes
              run: bash bin/install-theme.sh
            - name: Change Permittion
              run: sudo chmod -R 777 ~/wp-env
            - name: Run PHP Unit Test
              run: npm run phpunit
    release:
        runs-on: ubuntu-latest
        needs: [php_unit]
        steps:
            - uses: actions/checkout@v7
            - name: Read .node-version
              run: echo "NODEVERSION=$(cat .node-version)" >> "$GITHUB_OUTPUT"
              id: nodenv
            - name: Setup Node.js (.node-version)
              uses: actions/setup-node@v7
              with:
                  node-version: '${{ steps.nodenv.outputs.NODEVERSION }}'
            - name: Setup PHP 8.1
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.1
            - name: Install NPM Scripts
              run: npm install
            - name: Install WP-CLI
              run: |
                  curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                  chmod +x wp-cli.phar
                  mv wp-cli.phar /usr/local/bin/wp
            - name: Make Distribution
              # 本番依存のインストールから zip の検証まで同じ手順で実行する。
              run: npm run dist
            - name: Create GitHub Release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref }}
                  release_name: Release ${{ github.ref }}
                  draft: false
                  prerelease: false
            - name: Upload Release Asset
              id: upload-release-asset
              uses: actions/upload-release-asset@v1.0.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: dist/${{ env.plugin_name }}.zip
                  asset_name: ${{ env.plugin_name }}.zip
                  asset_content_type: application/zip
